name: Generate pacman animation

on:
  schedule:
    # Roda a cada 12 horas (correto)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate pacman SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Esta action gera pacman-contribution-graph.svg e pacman-contribution-graph-dark.svg no diretório atual

      - name: Create output directory
        run: |
          mkdir -p output
          cp pacman-contribution-graph.svg output/
          cp pacman-contribution-graph-dark.svg output/ 2>/dev/null || true

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: gh-pages
          build_dir: output
          github_token: ${{ secrets.GITHUB_TOKEN }}
